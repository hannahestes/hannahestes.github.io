<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <meta name="description" content="{{ site.title }}: {{ site.info }}"/>
        <meta name="author" content="{{ site.title }}"/>
        <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }} | {{ site.info }}</title>
        <link rel="icon" type="image/png" href="{{ site.icon-pic }}"/>

        <!-- Icons: Font Awesome (most icons) and Academicons (Google Scholar, ORCID, DBLP) -->
        <script src="https://use.fontawesome.com/releases/v5.15.3/js/all.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

        <!-- Bootstrap (grid and base typography) -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

        {% if page.map %}
        <!-- About page: maps, and the handwritten font for polaroid captions -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/jsvectormap.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap">
        {% endif %}

        <link rel="stylesheet" href="styles/styles.css"/>
    </head>

    <body class="light-theme">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <a id="back-to-top-button" href="#" aria-label="Back to top"><i class="fas fa-chevron-up" aria-hidden="true"></i></a>
        <button class="toggle-theme-button" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>

        <div class="container" style="padding-top: 3rem;">
            {% include_relative _sections/profile.html %}
            {% include_relative _sections/nav.html %}
            {{ content }}
            {% include_relative _sections/footer.html %}
        </div>

        <script src="js/scripts.js"></script>

        {% if page.map %}
        <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/jsvectormap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/maps/world.js"></script>
        <!-- the US map is only published in jsvectormap's 1.4.x source -->
        <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.4.5/src/maps/us-aea-en.js"></script>
        <script src="js/maps.js"></script>
        {% endif %}
    </body>
</html>

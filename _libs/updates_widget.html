{% assign timeline_position = forloop.index0 | modulo: 2 %}
<article class="updates-timeline-item {% if timeline_position == 0 %}updates-timeline-item--top{% else %}updates-timeline-item--bottom{% endif %}">
    <div class="updates-timeline-marker" aria-hidden="true">
        <span class="updates-timeline-dot"></span>
    </div>
    <div class="updates-timeline-card">
        {% if update.picture %} <img src="{{ update.picture }}" alt="" class="updates-timeline-image"> {% endif %}
        <div class="updates-timeline-time">{{ update.time }}</div>
        <div class="updates-timeline-desc">{{ update.desc }}</div>
    </div>
</article>

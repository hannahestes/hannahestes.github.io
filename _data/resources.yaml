  - title: Threats to Validity Clarification
    summary: Using a Target Analogy
    content: |-
      - **Statistical conclusion validity** ensures that your arrows are on the target at all. Without it, your arrows might not even reach the target.
      - **Internal validity** ensures that your arrows consistently hit the same spot on the target.
      If you don't hit the same spot every time, you can't be sure your
      technique is responsible for the result.
      - **Construct validity** checks that you hit the correct area of the target. You might be consistent, but are you measuring the right thing?
      - **External validity** asks if you can hit the bullseye on different targets in different
      locations and under different weather conditions. You can only attempt
      this after you are confident in your aim at the first target.
    category: research


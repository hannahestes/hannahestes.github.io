  - title: Presentation Help!
    summary: Here are some helpful links (e.g., presentation layout, icons) for making presentations.
    content: |-
      1. Problem + Motivation (1-2 slides, what problem(s) do you address
      with your work? Why is it important to solve this problem? If
      reasonable, you should introduce a *running example* at this point)

      2. Solution Idea (1 slide, give a short overview about the approach
      you are going to describe. At this point, I like to show the "Big
      Picture" of my solution.)
      
      3. Outline of your talk (1 slide, if reasonable for your topic, you
      should utilize the big picture and highlight different stages of it
      during your talk)
      
      4. Details (but keep it simple and remember a talks purpose is to
      raise interest for your paper. If you didn't introduce a running example in the motivation part, do it now und use it intensively in the
      following slides)
      
      5. Conclusion + Future Work (1-2 slides, what are the main messages
      of your talk? Mention some ideas for further improvements)
      
      6. Finally, show the big picture again extended with some additional
      information from the "Details" section (on one slide!). This helps your
      audience to ask questions.
      
      7. Prepare some backup slides for possible questions.
      
      - <https://users.ece.cmu.edu/~pueschel/teaching/guides/guide-presentations.pdf>
      - <https://www.unomaha.edu/college-of-information-science-and-technology/_files/docs/round-tables/tips-for-academic-presentations-mdavidson.pdf>
      - <https://medium.com/navigating-academia/the-last-slide-in-an-academic-conference-presentation-strategically-populate-the-last-slide-with-e89173eac2fa>
    category: research

  - title: Developing Research Questions
    summary: 3 Questions I Ask...
    content: |-
      - How to approximate it?
      - How can we make it cheaper? (including time for other people and time for self)
      - How would we actually a study this?
    category: research

  - title: Inductive Writing All the Way!
    summary: 
    content: |-
      Write inductively not deductively! The first sentence should say X and then follow up with how you got there. If you bolded the first sentence of each paragraph, does it summarize the rest?
    category: research


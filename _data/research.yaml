under-review:
  - title: "The Evolution of Software Product Manager Role Expectations in Software Teams"
    system-name:
    venue: ICSE-SEIP
    year: 2027
    location: Dublin, Ireland
    venue-web: https://conf.researchr.org/track/icse-2027/icse-2027-seip
    status:
    authors: <b>Hannah Estes</b>, Satwika Kancharla, Kathryn Thomasset.
    pdf:
    code:
    demo:
    slides:
    talk:
    doi:
    poster:
    abstract: >-
      The software product manager is often a multidisciplinary role and, like many other software industry roles,
      ever-changing in the wake of AI. The goal of this work is to
      uncover software product manager role expectations from two
      perspectives – their own and that of the software team – and
      two time periods: before AI was strongly impacting their work
      and after. In 2024, we deployed a survey targeting software
      professionals (n=80, 22 companies) to uncover software product
      manager role expectations and the typical questions they answer,
      providing direct and indirect lenses into software product
      manager activities when AI was not as pervasive. Through qualitative
      analysis, we discovered that software product managers must be
      <span class="smallcaps">Product Experts</span>, <span class="smallcaps">User Advocates</span>,
      and <span class="smallcaps">Communication Gurus</span>. Focusing on the impact of AI, a second survey was
      deployed (n=53, 35 companies) in 2026 to examine how software
      product managers are using AI and to look at how the software
      product management role is evolving from both perspectives.
      From this, we have identified a strong disadvantage in not
      incorporating AI into SPM workflows, with the most common
      tasks being data discovery and synthesis, and that the boundary
      between SPMs and SWEs will likely continue to blur. SPMs, more
      than ever, should prioritize the direction and team’s capabilities
      to continue delivering a valuable and sustainable product.
    category: spm

  - title: "Software Product Managers, Software Teams, and the Requirements Between Them"
    system-name:
    venue: ICSE-SEIP
    year: 2027
    location: Dublin, Ireland
    venue-web: https://conf.researchr.org/track/icse-2027/icse-2027-seip
    status:
    authors: <b>Hannah Estes</b>, Satwika Kancharla, Kathryn Thomasset.
    pdf:
    code:
    demo:
    slides:
    talk:
    doi:
    poster:
    abstract: >-
      Software product managers (SPMs) are responsible for maintaining and evolving a product's vision. They are the bridge among customers, the business, and the software team, yet their role can be contentious, with tensions sometimes arising between the software product manager and the software team. Requirements, the artifacts at the center of this relationship, are also changing rapidly as AI is used more within the software industry. To understand where friction arises between SPMs and software teams and how AI is reshaping the requirements between them, we distributed two surveys, receiving responses from 56 product-focused and 40 engineering-focused participants across 44 companies. Using thematic analysis, we identify eight friction points centered on communication and competency issues. Our second survey highlights the frequency of these problems, as well as <i>how</i> software teams are documenting requirements and the impact of AI on that process. While the majority of participants agree that AI has changed this process, they differ in how it affects quality and trust. Authorship of requirements has become less structured, yet accountability still remains with the SPM. Our findings suggest that AI does not resolve the friction between SPMs and software teams, but rather increases the burden on SPMs to review requirements generated not just by themselves but by anyone on the team.
    category: spm

  - title: "Comparing What Rule-based and LLM-based Tools Report on Student Team Projects"
    system-name:
    venue: ICSE-SEET
    year: 2027
    location: Dublin, Ireland
    venue-web: https://conf.researchr.org/track/icse-2027/icse-2027-software-engineering-education-and-training--seet-
    status:
    authors: Tiva Rocco, <b>Hannah Estes</b>, Sarah Heckman.
    pdf:
    code:
    demo:
    slides:
    talk:
    doi:
    poster:
    abstract: >- 
      Instructors and students can choose between rule-based static analysis and reviewers built on large language models to assess code, but little is known about how the two approaches differ. 
      This study compares SonarQube, a deterministic rule-based tool, with a Gemini-based reviewer across nine team repositories, using Java and JavaScript, from one six-week course project, with a focus on increasing code quality and maintainability. 
      The tools reported 1,889 issues, of which 320 were distinct. 
      Two raters sorted these into ten categories using open card sorting.  
      Logic and simplification make up 68% of SonarQube's issues but 33% of Gemini's. 
      Gemini reports a larger share of error handling, typing, dead code, and design issues, and it alone reports hardcoding issues. 
      The tools flag many of the same files, but rarely the same lines, and only 18% of  Gemini's issues fall within five lines of a SonarQube issue. 
      SonarQube returned identical issues across two runs, while the Gemini runs contained little overlap. 
      The results suggest that Gemini's reports may be better suited for students' own review than for grading, while SonarQube's repeatable reports may suit both uses. 
      Combining the tools would broaden coverage, provided the large language model's reports are checked. 
    category: other



projects:
  - title: "Who Shapes the Stance? A Stases-Based Analysis of Writer-LLM Negotiation with CoAuthor"
    system-name: 
    image: assets/img/vda_vlhcc.jpg
    venue: VL/HCC
    year: 2026
    location: Paderborn, Germany
    venue-web: https://conf.researchr.org/home/vlhcc-2026
    status: 
    authors: <b>Hannah Estes</b>, Kathryn T. Stolee.
    pdf: assets/papers/Shaping_Stances_VDA__VLHCC.pdf
    code: 
    demo: 
    slides: assets/slides/VLHCC_Who_Shapes_the_Stance_VLHCC_Talk.pdf
    talk: 
    doi: 
    poster: 
    abstract: >-
      Large language models are pervasive in everyday writing tools, yet in most 
      instances, the rhetorical elements of
      the writing are not considered. Using data from CoAuthor, an
      LLM writing assistant and dataset, we qualitatively coded 20
      argumentative writing sessions across three dimensions: when
      the LLM was prompted, the rhetorical content of its suggestions,
      and the outcomes of those suggestions. We find a failure of
      negotiation where the LLMs often default to 
      generating facts
      and opinions 63% of the time, which writers often reject.
      More critically, 33% of accepted suggestions are ultimately
      changed, revealing that the initial acceptance masks a deeper
      misalignment. Through multiple correspondence analysis and
      multinomial logistic regression, we find that who the writer is
      explains significantly more variance in a suggestion’s outcome
      rather than what the LLM suggests or where it is prompted. The
      solution is not to solely focus on generating better suggestions with
      higher acceptance rates, but build systems that learn and adapt
      to each writer’s unique style and rhetorical trajectory. When the
      LLM ignores the author’s characteristics and focuses instead on
      opinions, it risks displacing the writer’s own voice, underscoring
      the individuality each writer brings to the session. From this,
      we argue that LLM-in-the-loop writing tools should adopt an
      iterative, writer-aware design inspired by the DevOps cycle of
      plan, do, check, and act, to continuously align suggestions to the
      writer’s personal style, rhetorical trajectory, and context.
    category: other
    
  - title: 'Advancing Software Product Management Education: Insights from an Industry Survey'
    system-name: 
    image: assets/img/fse-seet-graphic.jpg
    venue: FSE-SEET
    year: 2025
    location: Trondheim, Norway
    venue-web: https://conf.researchr.org/home/fse-2025
    status:
    authors: <b>Hannah Estes</b>, Katie Hollowell, John Cheek, Shiv Patel, Hanna Reese, Kathryn T. Stolee.
    pdf: assets/papers/AdvancingSPMEducation_FSE_SEET_2025.pdf
    code: 
    demo: 
    slides: assets/slides/FSE_EmployabilityandProfessionalCompetence_1030_HannahEstes_Advancing.pptx
    talk: 
    doi: https://doi.org/10.1145/3696630.3727256
    poster: 
    abstract: >-
      Software product managers have become critical to a software product’s success.
      They act as a liaison among various stakeholders - software engineers,
      management, and customers - to ensure a product meets customer needs. Despite
      the role’s rise in popularity, research and related educational materials are
      just emerging. In this paper, we aim to understand the educational needs of
      software product managers, and why embedding them in a software
      team is valuable. To do this, we collected survey responses from 59 software
      product managers and 63 software engineers, with responses from at least 24
      companies, to identify the topics, skills, and abilities that software product
      managers find important for the role and the value they provide to software
      teams. Our results reveal that a software product manager’s value stems from
      their ability to provide the team with direction and a plan, give context for
      decision-making, and effectively communicate across stakeholders. To support
      this, someone new to the role must have competencies in technical and
      non-technical areas. A software product manager must excel at interpersonal
      communication, understanding the technical atmosphere, and deriving product
      sense from a vision and strategy. This paper provides the groundwork for future
      software product management curricula by identifying 21 key competencies and 10
      factors to describe the role’s value in software teams.
    category: spm
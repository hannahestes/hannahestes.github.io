projects:
  - title: "Who Shapes the Stance? A Stases-Based Analysis of Writer-LLM Negotiation with CoAuthor"
    system-name: 
    gif: assets/img/vda_vlhcc.png
    conference: "VL/HCC" 
    conference-web: https://conf.researchr.org/home/vlhcc-2026
    status: Currently Under Review
    authors: <b>Hannah Estes</b>, Kathryn T. Stolee.
    pdf: assets/papers/blank_notyet.pdf
    code: 
    demo: 
    slides:
    talk: 
    doi:
    poster: 
    abstract-less: >-
      Large language models are pervasive in everyday writing tools, yet in most 
      instances, the rhetorical elements of the writing are not considered. 
      Using data from CoAuthor, an LLM writing assistant, we qualitatively coded 
      20 argumentative writing sessions across three dimensions: when the LLM was
      prompted, the rhetorical content of its suggestions, and the outcomes of those 
      suggestions. We find a failure of negotiation where the LLMs often default to 
    abstract-more: >-
      generating facts and opinions 63% of the time, which writers often reject. More
      critically, when writers do accept suggestions, 31% are later edited or reversed, 
      revealing that the initial acceptance masks a deeper
      misalignment. Through multiple correspondence analysis and
      multinomial logistic regression, we find that who the writer is
      explains significantly more variance in a suggestion’s outcome
      rather than what the LLM suggests or where it is prompted. This
      suggests that the solution is not to generate better suggestions
      with higher acceptance rates, but build systems that learn and
      adapt to each writer’s unique style and rhetorical trajectory.
      When the LLM ignores the author’s characteristics and focuses
      instead on opinions, it risks displacing the writer’s own voice,
      underscoring the individuality and autonomy each writer brings
      to the session. From this, we argue that LLM-in-the-loop writing
      tools should adopt an iterative, writer-aware design inspired by
      the DevOps cycle of plan, do, check, and act, to continuously
      align suggestions to the writer’s context, rhetorical trajectory,
      and personal style.
    tag: vda_ai_writing_tools
    category: other
  - title: "Expectations of Software Product Managers: An Empirical Evaluation of Software Professionals' Perspectives"
    system-name: 
    gif: assets/img/TOSEM_graphic.png
    conference: TOSEM 
    conference-web: https://dl.acm.org/journal/tosem
    status: Currently Under Review
    authors: <b>Hannah Estes</b>, Satwika Kancharla, Kathryn T. Stolee.
    pdf: assets/papers/blank_notyet.pdf
    code: 
    demo: 
    slides:
    talk: 
    doi:
    poster: 
    abstract-less: >-
      The role of the software product manager is often ambiguous and potentially
      contentious, with tensions often arising between the software product manager
      and the software team. The goal of this work is to uncover software product
      manager role expectations from three perspectives: their own, that of the
      software team, and that of the software companies. We deployed a survey
      targeting
    abstract-more: >-
      software professionals (n=80, 22 companies) to uncover software product manager
      role expectations and the typical questions they answer, providing direct and
      indirect lenses into software product manager activities. Through qualitative
      analysis, we discovered that software product managers must be product experts,
      user advocates, and communication gurus. From the companies’ perspective, we
      analyzed 37 job descriptions to generalize our findings. We also identify that
      communication and competency issues lead to frequent team frustration. Our
      findings provide clarity on the software product manager role directly through
      employees’ and employers’ perspectives, indirectly from the questions they
      should answer, and through eight friction points when working with a software
      team. We synthesize these results across the software development lifecycle in
      the SENSE framework, providing a comprehensive view of software product manager
      role expectations and points of friction with software teams.
    tag: spm_role_questions_jobs
    category: spm

  - title: 'Advancing Software Product Management Education: Insights from an Industry Survey'
    system-name: 
    gif: assets/img/fse-seet-graphic.png
    conference: FSE-SEET (Trondheim, Norway) 
    conference-web: https://conf.researchr.org/home/fse-2025
    status:
    authors: <b>Hannah Estes</b>, Katie Hollowell, John Cheek, and Shiv Patel, Hanna Reese, Kathryn T. Stolee.
    pdf: assets/papers/AdvancingSPMEducation_FSE_SEET_2025.pdf
    code: 
    demo: 
    slides: assets/slides/FSE_EmployabilityandProfessionalCompetence_1030_HannahEstes_Advancing.pptx
    talk: 
    doi: https://doi.org/10.1145/3696630.3727256
    poster: 
    abstract-less: >-
      Software product managers have become critical to a software product’s success.
      They act as a liaison among various stakeholders - software engineers,
      management, and customers - to ensure a product meets customer needs. Despite
      the role’s rise in popularity, research and related educational materials are
      just emerging. In this paper, we aim to understand the educational needs of
      software product managers, and why embedding them in a software
    abstract-more: >-
      team is valuable. To do this, we collected survey responses from 59 software
      product managers and 63 software engineers, with responses from at least 24
      companies, to identify the topics, skills, and abilities that software product
      managers find important for the role and the value they provide to software
      teams. Our results reveal that a software product manager’s value stems from
      their ability to provide the team with direction and a plan, give context for
      decision-making, and effectively communicate across stakeholders. To support
      this, someone new to the role must have competencies in technical and
      non-technical areas. A software product manager must excel at interpersonal
      communication, understanding the technical atmosphere, and deriving product
      sense from a vision and strategy. This paper provides the groundwork for future
      software product management curricula by identifying 21 key competencies and 10
      factors to describe the role’s value in software teams.
    tag: spm_edu
    category: spm
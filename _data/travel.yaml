introduction: >-
  I'm so grateful to get to travel for research! Here's everywhere I've been for conferences
  and workshops. Hover over a highlighted country or a pin to see the trip.

# country: two-letter ISO country code (used to highlight the country on the map)
# coords: [latitude, longitude] of the city (used to place the pin)
# url: link to the event website (optional)
# photos: a few pictures from the trip (optional), each with a src and a short caption.
#   keep them small (~1000px wide jpgs in assets/travel/) so the page loads quickly
trips:

  - event: VL/HCC 2026
    url: https://conf.researchr.org/home/vlhcc-2026
    city: Paderborn, Germany
    country: DE
    coords: [51.72, 8.75]
    time: October 2026

  - event: ACM AI Leadership Summit
    url: https://aisummit26.acm.org/
    city: Atlanta, Georgia
    country: US
    coords: [33.75, -84.39]
    time: September 2026

  - event: ICSE 2026
    url: https://conf.researchr.org/home/icse-2026
    city: Rio de Janeiro, Brazil
    country: BR
    coords: [-22.91, -43.17]
    time: April 2026

  - event: VL/HCC 2025
    url: https://conf.researchr.org/home/vlhcc-2025
    city: Raleigh, North Carolina
    country: US
    coords: [35.78, -78.64]
    time: October 2025
    photos:
      - src: assets/travel/vlhcc2025_group.jpg
        caption: VL/HCC fun
      - src: assets/travel/vlhcc2025_p2.jpg
        caption: VL/HCC!

  - event: FSE 2025
    url: https://conf.researchr.org/home/fse-2025
    city: Trondheim, Norway
    country: "NO"
    coords: [63.43, 10.40]
    time: June 2025
    photos:
      - src: assets/travel/fse2025_trondheim.jpg
        caption: exploring trondheim
      - src: assets/travel/fse2025_group.jpg
        caption: FSE group

  - event: CRA-WP Grad Cohort Workshop
    url: https://cra.org/cra-wp/events/2025-cra-wp-grad-cohort-workshops/
    city: Denver, Colorado
    country: US
    coords: [39.74, -104.99]
    time: April 2025

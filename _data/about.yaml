research-introduction: >-
  I'm fascinated by the human and organizational factors that shape software development,
  especially how team communication and coordination impact the products we build. My
  research focuses on the interactions between software product managers (SPMs) and software
  engineers (SWEs), exploring where alignment succeeds and where misalignment creates friction.
  I also enjoy creating educational opportunities, like an undergraduate course, to help
  future SPMs develop both the technical and interpersonal skills they need to thrive in
  real software teams.

research-interests:

  - field: Software Engineering
    subfields: team productivity, software product management
  
  - field: Human-Computer Interaction
    subfields: socio-technical systems, user-centered product design

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- {HE}: slab-serif "HE" ligature (shared stem, H crossbar runs into the E's middle arm) in curly braces. White on terracotta, 16:10 badge -->
    <rect x="0" y="6" width="32" height="20" rx="2.5" fill="#B36C56"/>
    <!-- braces -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path transform="translate(1 8) scale(0.5)" d="M7 3.5C4 3.5 4 5.5 4 8.5V12.5C4 14.8 3.1 16 1.4 16C3.1 16 4 17.2 4 19.5V23.5C4 26.5 4 28.5 7 28.5"/>
        <path transform="translate(15 8) scale(0.5)" d="M25 3.5C28 3.5 28 5.5 28 8.5V12.5C28 14.8 28.9 16 30.6 16C28.9 16 28 17.2 28 19.5V23.5C28 26.5 28 28.5 25 28.5"/>
    </g>
    <!-- HE ligature, scaled to 80% around the center -->
    <g fill="#FFFFFF" transform="translate(3.2 3.2) scale(0.8)">
        <rect x="5" y="10" width="5.5" height="1.5"/>      <!-- H top slab serif -->
        <rect x="5" y="20.5" width="5.5" height="1.5"/>    <!-- H bottom slab serif -->
        <rect x="6.5" y="10" width="2.5" height="12"/>     <!-- H left stem -->
        <rect x="15.5" y="10" width="2.5" height="12"/>    <!-- shared stem -->
        <rect x="9" y="14.75" width="15.5" height="2.5"/>  <!-- crossbar / E middle arm -->
        <rect x="15.5" y="10" width="11.5" height="2.5"/>  <!-- E top arm -->
        <rect x="24.5" y="10" width="2.5" height="3.5"/>   <!-- E top serif -->
        <rect x="15.5" y="19.5" width="11.5" height="2.5"/><!-- E bottom arm -->
        <rect x="24.5" y="18.5" width="2.5" height="3.5"/> <!-- E bottom serif -->
    </g>
</svg>

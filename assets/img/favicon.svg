<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- {HE}: HE slab-serif monogram (H and E share a stem) in curly braces. Terracotta on light browser themes, green on dark (matches the site's accents) -->
    <style>
        .mark { fill: #B36C56; }
        .brace { fill: none; stroke: #B36C56; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        @media (prefers-color-scheme: dark) { .mark { fill: #bcdf86; } .brace { stroke: #bcdf86; } }
    </style>
    <!-- braces, centered on y = 14 (sits slightly high so it lines up with tab text) -->
    <path class="brace" transform="translate(0 2.48) scale(0.72)" d="M7 3.5C4 3.5 4 5.5 4 8.5V12.5C4 14.8 3.1 16 1.4 16C3.1 16 4 17.2 4 19.5V23.5C4 26.5 4 28.5 7 28.5"/>

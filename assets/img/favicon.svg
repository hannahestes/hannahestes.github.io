        <rect x=".8" width="1.8" height="10"/><rect y="0" width="3.4" height="1"/><rect y="9" width="3.4" height="1"/><rect x=".8" y="4.3" width="11" height="1.4"/><rect x="7.6" width="1.8" height="10"/><rect x="6.8" width="7.6" height="1.4"/><rect x="6.8" y="8.6" width="7.6" height="1.4"/><rect x="13" width="1.4" height="2.6"/><rect x="13" y="7.4" width="1.4" height="2.6"/>

<!-- Navigation bar (pages from _data/navigation.yaml, plus the CV) -->

<nav class="site-nav" aria-label="Main">
    <ul>
        {% for item in site.data.navigation.pages %}
            {% assign item_url = "/" | append: item.url %}
            {% if page.url == item_url or page.url == "/" and item.url == "index.html" %}{% assign is_active = true %}{% else %}{% assign is_active = false %}{% endif %}
            <li><a href="{{ item.url }}" class="nav-item-link{% if is_active %} active{% endif %}"{% if is_active %} aria-current="page"{% endif %}><i class="{{ item.icon }}" aria-hidden="true"></i> {{ item.title }}</a></li>
        {% endfor %}
        <li><a target="_blank" rel="noopener" href="{{ site.data.about.resume }}" class="nav-item-link"><i class="fas fa-file" aria-hidden="true"></i> CV</a></li>
    </ul>
</nav>

<!-- Lab fun section: lab photos as polaroids -->

<hr>
<div class="row" id="lab">
    <div class="col">
        <h2 class="mb-1"><i class="fas fa-users" aria-hidden="true"></i> Lab Fun</h2>
        <p class="mb-0">{{ site.data.lab.introduction }}</p>
        <div class="polaroid-row mb-3">
            {% for photo in site.data.lab.photos %}
                {% include_relative _libs/polaroid.html photo=photo %}
            {% endfor %}
        </div>
    </div>
</div>
